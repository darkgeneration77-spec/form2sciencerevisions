<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form 2 Science Revision Hub</title>
<style>
:root{--text:#f8fafc;--muted:#cbd5e1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b 48%,#064e3b);color:var(--text)}
.wrap{width:min(1500px,100%);margin:auto;padding:18px}
.hero{padding:24px;border:1px solid #ffffff22;border-radius:22px;background:#ffffff12}
.hero h1{margin:8px 0;font-size:clamp(2rem,4vw,3.4rem)}
.hero p{margin:0;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.menu button{border:1px solid #ffffff24;border-radius:16px;padding:16px;color:#fff;font-weight:900;font-size:1rem;cursor:pointer;background:#ffffff10}
.menu button.active{background:#fff;color:#111827}
.menu button:nth-child(1){box-shadow:inset 0 -4px 0 #3b82f6}
.menu button:nth-child(2){box-shadow:inset 0 -4px 0 #8b5cf6}
.menu button:nth-child(3){box-shadow:inset 0 -4px 0 #14b8a6}
.menu button:nth-child(4){box-shadow:inset 0 -4px 0 #f59e0b}
.viewer{display:none;width:100%;height:calc(100vh - 190px);min-height:720px;border:0;border-radius:20px;background:#fff}
.viewer.active{display:block}
.note{margin-top:12px;color:var(--muted);text-align:center;font-size:.9rem}
@media(max-width:850px){.menu{grid-template-columns:1fr 1fr}.viewer{height:calc(100vh - 250px);min-height:680px}}
@media(max-width:500px){.menu{grid-template-columns:1fr}.viewer{height:calc(100vh - 350px)}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <strong>FORM 2 SCIENCE • ORIGINAL FILES HUB</strong>
  <h1>Chapter 5–7 + KA</h1>
  <p>This index only connects the four uploaded original HTML files. Their contents are not modified.</p>
</section>

<nav class="menu">
  <button class="active" onclick="openModule(0,this)">Chapter 5<br>Water</button>
  <button onclick="openModule(1,this)">Chapter 6<br>Acids & Alkalis</button>
  <button onclick="openModule(2,this)">Chapter 7<br>Electricity & Magnetism</button>
  <button onclick="openModule(3,this)">KA Final Boss<br>Comprehensive Assessment</button>
</nav>

<iframe class="viewer active" title="Chapter 5" src="form2_science_chapter5_click_to_open_parts_v10.html"></iframe>
<iframe class="viewer" title="Chapter 6" src="form2_science_chapter6_complete_part1_to_part7_rescue_pack_v7.html"></iframe>
<iframe class="viewer" title="Chapter 7" src="form2_science_chapter7_complete_part1_to_part7_final_v7.html"></iframe>
<iframe class="viewer" title="KA Final Boss" src="form2_science_chapter5_6_7_KA_final_boss_v1.html"></iframe>

<p class="note">Only index.html was updated. The four original HTML files remain unchanged.</p>
</main>
<script>
function openModule(index,button){
  document.querySelectorAll('.viewer').forEach((x,i)=>x.classList.toggle('active',i===index));
  document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
