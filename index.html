<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form 2 Science Revision Hub</title>
<style>
:root{--text:#f8fafc;--muted:#cbd5e1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b 48%,#064e3b);color:var(--text);overflow-x:hidden}
.wrap{width:min(1500px,100%);margin:auto;padding:18px}
.hero{padding:24px;border:1px solid #ffffff22;border-radius:22px;background:#ffffff12}
.hero h1{margin:8px 0;font-size:clamp(2rem,4vw,3.4rem)}
.hero p{margin:0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.controls button{border:1px solid #ffffff35;border-radius:12px;padding:10px 14px;background:#ffffff16;color:#fff;font-weight:900;cursor:pointer}
.controls input{width:150px}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.menu button{border:1px solid #ffffff24;border-radius:16px;padding:16px;color:#fff;font-weight:900;font-size:1rem;cursor:pointer;background:#ffffff10}
.menu button.active{background:#fff;color:#111827}
.menu button:nth-child(1){box-shadow:inset 0 -4px 0 #3b82f6}
.menu button:nth-child(2){box-shadow:inset 0 -4px 0 #8b5cf6}
.menu button:nth-child(3){box-shadow:inset 0 -4px 0 #14b8a6}
.menu button:nth-child(4){box-shadow:inset 0 -4px 0 #f59e0b}
.viewer{display:none;width:100%;height:calc(100vh - 245px);min-height:720px;border:0;border-radius:20px;background:#fff}
.viewer.active{display:block}
.note{margin-top:12px;color:var(--muted);text-align:center;font-size:.9rem}
#fxLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99999}
.fx-piece{position:absolute;left:50%;top:50%;font-weight:900;will-change:transform,opacity}
.fx-banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);padding:16px 28px;border-radius:18px;font-size:clamp(1.4rem,4vw,2.7rem);font-weight:1000;box-shadow:0 18px 45px #0007;animation:bannerPop 1.1s ease forwards}
.correct-banner{background:linear-gradient(135deg,#22c55e,#14b8a6);color:#fff}.wrong-banner{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff}
.fx-ring{position:absolute;left:50%;top:50%;width:40px;height:40px;border:8px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:ring 1s ease-out forwards}
.screen-shake{animation:shake .45s linear}.screen-flash-green::after,.screen-flash-red::after{content:"";position:fixed;inset:0;z-index:99998;pointer-events:none;animation:flash .55s ease forwards}.screen-flash-green::after{background:#22c55e66}.screen-flash-red::after{background:#ef444466}
@keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-30px) scale(.5)}35%{opacity:1;transform:translate(-50%,0) scale(1.12)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
@keyframes ring{to{width:650px;height:650px;opacity:0;border-width:2px}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.5) rotate(var(--r))}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@media(max-width:850px){.menu{grid-template-columns:1fr 1fr}.viewer{height:calc(100vh - 310px);min-height:680px}}
@media(max-width:500px){.menu{grid-template-columns:1fr}.viewer{height:calc(100vh - 435px)}}
</style>
</head>
<body>
<div id="fxLayer"></div>
<main class="wrap" id="appWrap">
<section class="hero">
  <strong>FORM 2 SCIENCE • ORIGINAL FILES HUB</strong>
  <h1>Chapter 5–7 + KA</h1>
  <p>The four original HTML files remain unchanged. Music and answer effects run from this index only.</p>
  <div class="controls">
    <button id="musicBtn" onclick="toggleMusic()">Play Music</button>
    <button onclick="nextTrack()">Next Track</button>
    <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.35" oninput="setVolume(this.value)"></label>
    <span id="trackName">Track 1: Focus Pulse</span>
  </div>
</section>

<nav class="menu">
  <button class="active" onclick="openModule(0,this)">Chapter 5<br>Water</button>
  <button onclick="openModule(1,this)">Chapter 6<br>Acids & Alkalis</button>
  <button onclick="openModule(2,this)">Chapter 7<br>Electricity & Magnetism</button>
  <button onclick="openModule(3,this)">KA Final Boss<br>Comprehensive Assessment</button>
</nav>

<iframe class="viewer active" title="Chapter 5" src="form2_science_chapter5_click_to_open_parts_v10.html"></iframe>
<iframe class="viewer" title="Chapter 6" src="form2_science_chapter6_complete_part1_to_part7_rescue_pack_v7.html"></iframe>
<iframe class="viewer" title="Chapter 7" src="form2_science_chapter7_complete_part1_to_part7_final_v7.html"></iframe>
<iframe class="viewer" title="KA Final Boss" src="form2_science_chapter5_6_7_KA_final_boss_v1.html"></iframe>

<p class="note">Correct and wrong effects are selected randomly from five styles each.</p>
</main>
<script>
function openModule(index,button){
  document.querySelectorAll('.viewer').forEach((x,i)=>x.classList.toggle('active',i===index));
  document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));
  button.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

let audioCtx,gainNode,musicTimer=null,musicOn=false,track=0,step=0;
const tracks=[
 {name:'Focus Pulse',notes:[261.63,329.63,392,329.63,293.66,349.23,440,349.23],tempo:330},
 {name:'Science Quest',notes:[220,277.18,329.63,440,329.63,277.18,246.94,329.63],tempo:290},
 {name:'Calm Lab',notes:[196,246.94,293.66,246.94,174.61,220,261.63,220],tempo:420},
 {name:'Final Boss',notes:[130.81,196,155.56,233.08,146.83,220,174.61,261.63],tempo:240}
];
function ensureAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();gainNode=audioCtx.createGain();gainNode.gain.value=+volume.value;gainNode.connect(audioCtx.destination)}}
function tone(freq,dur=.16,type='triangle',vol=.12){ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(gainNode);o.start();o.stop(audioCtx.currentTime+dur)}
function scheduleMusic(){clearInterval(musicTimer);step=0;musicTimer=setInterval(()=>{if(!musicOn)return;const t=tracks[track];tone(t.notes[step%t.notes.length],.22,'sine',.055);if(step%2===0)tone(t.notes[step%t.notes.length]/2,.28,'triangle',.03);step++},tracks[track].tempo)}
function toggleMusic(){ensureAudio();if(audioCtx.state==='suspended')audioCtx.resume();musicOn=!musicOn;musicBtn.textContent=musicOn?'Pause Music':'Play Music';if(musicOn)scheduleMusic();else clearInterval(musicTimer)}
function nextTrack(){track=(track+1)%tracks.length;trackName.textContent=`Track ${track+1}: ${tracks[track].name}`;if(musicOn)scheduleMusic()}
function setVolume(v){ensureAudio();gainNode.gain.value=+v}
function correctSound(){tone(523.25,.12,'sine',.18);setTimeout(()=>tone(659.25,.13,'sine',.18),90);setTimeout(()=>tone(783.99,.2,'sine',.2),180)}
function wrongSound(){tone(180,.18,'sawtooth',.12);setTimeout(()=>tone(130,.28,'square',.1),110)}

const layer=document.getElementById('fxLayer');
function clearFxLater(){setTimeout(()=>{layer.innerHTML='';document.body.classList.remove('screen-shake','screen-flash-green','screen-flash-red')},1300)}
function banner(text,good){const d=document.createElement('div');d.className='fx-banner '+(good?'correct-banner':'wrong-banner');d.textContent=text;layer.appendChild(d)}
function particles(chars,count,mode){for(let i=0;i<count;i++){const p=document.createElement('span');p.className='fx-piece';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.fontSize=(18+Math.random()*26)+'px';p.style.setProperty('--x',((Math.random()-.5)*900)+'px');p.style.setProperty('--y',(mode==='fall'?(350+Math.random()*500):((Math.random()-.5)*700))+'px');p.style.setProperty('--r',((Math.random()-.5)*900)+'deg');p.style.animation=(mode==='fall'?'fall':'burst')+' '+(.65+Math.random()*.55)+'s ease-out forwards';layer.appendChild(p)}}
function rings(good){for(let i=0;i<4;i++){setTimeout(()=>{const r=document.createElement('div');r.className='fx-ring';r.style.borderColor=good?['#22c55e','#fde047','#38bdf8','#fff'][i]:['#ef4444','#f97316','#a855f7','#fff'][i];layer.appendChild(r)},i*100)}}
function correctFx(){correctSound();const n=Math.floor(Math.random()*5);if(n===0){particles(['★','✦','✧'],45,'burst');banner('CORRECT!',true)}if(n===1){particles(['🎉','✨','◆','●'],55,'fall');banner('EXCELLENT!',true)}if(n===2){rings(true);banner('MASTER MOVE!',true)}if(n===3){document.body.classList.add('screen-flash-green');particles(['✓','✓','★'],35,'burst')}if(n===4){banner('COMBO +1',true);particles(['⚡','✦','★'],50,'burst')}clearFxLater()}
function wrongFx(){wrongSound();const n=Math.floor(Math.random()*5);if(n===0){document.body.classList.add('screen-shake');banner('TRY AGAIN',false)}if(n===1){document.body.classList.add('screen-flash-red');particles(['×','!','?'],32,'burst')}if(n===2){rings(false);banner('REVIEW THIS',false)}if(n===3){particles(['💥','×','!'],38,'fall');banner('NOT YET',false)}if(n===4){document.body.classList.add('screen-shake');particles(['⚠','×','?'],42,'burst');banner('LEARN & RETRY',false)}clearFxLater()}

function installWatcher(frame){
 try{
  const doc=frame.contentDocument;if(!doc||doc.__fxInstalled)return;doc.__fxInstalled=true;
  const seenGood=new WeakSet(),seenBad=new WeakSet();
  function scan(){
   const good=[...doc.querySelectorAll('.correct,.correct-box')].filter(x=>!seenGood.has(x));
   const bad=[...doc.querySelectorAll('.wrong,.wrong-box')].filter(x=>!seenBad.has(x));
   good.forEach(x=>seenGood.add(x));bad.forEach(x=>seenBad.add(x));
   if(good.length)correctFx();if(bad.length)wrongFx();
  }
  doc.addEventListener('click',e=>{const b=e.target.closest('button,input[type=button],input[type=submit]');if(b)setTimeout(scan,120)});
  new MutationObserver(()=>setTimeout(scan,30)).observe(doc.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
 }catch(e){console.warn('Effect watcher unavailable',e)}
}
document.querySelectorAll('.viewer').forEach(f=>{f.addEventListener('load',()=>installWatcher(f));setTimeout(()=>installWatcher(f),1500)});
</script>
</body>
</html>
